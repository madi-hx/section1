<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="ticketbooking.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #5c0b0b;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Movie Ticket Booking</h1>

        <form>
            <label for="name">Customer Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="movie">Select Movie:</label>
            <select id="movie">
                <option>Avengers: Endgame</option>
                <option>Spider-Man: No Way Home</option>
                <option>Interstellar</option>
                <option>Inception</option>
            </select>

            <label for="timing">Select Timing:</label>
            <select id="timing">
                <option>10:00 AM</option>
                <option>1:00 PM</option>
                <option>4:00 PM</option>
                <option>7:00 PM</option>
                <option>10:00 PM</option>
            </select>

            <label for="date">Select Date:</label>
            <input type="date" id="date">

            <label for="seats">Number of Seats:</label>
            <input type="number" id="seats" min="1" max="10" placeholder="Enter number of seats">

            <button type="submit">Book Ticket</button>
        </form>
    </div>

</body>
</html>
