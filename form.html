<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
</head>
<body>
    <h1>
        Student Admission Form 
    </h1>

    <form>
        <label for="name">Student Name</label>
        <input type="text">

        <br>
        <br>
        
        <label for="email">Student Email</label>
        <input type="email">

        <br>
        <br>

        <label for="">Date of Birth</label>
        <input type="date">

        <br>
        <br>

        <label for="">Address</label>
        <textarea cols= "20" rows="4"></textarea>

        <br>
        <br>

        <label for="">Select Gender</label>
        <input type="radio" name="gender" >Male
        <input type="radio" name="gender" >Female

        <br>
        <br>

        <label for="course">Select Course</label>
        <select name="course">
            <option>MERN Stack Development</option>
            <option>Data Science</option>
            <option>Data Analysis</option>
            <option>Devops</option>
            <option>UI UX</option>
        </select>

        <br>
        <br>

        <label for="college">Select College</label>
        <input type="text" list="college">
        
            <datalist id="college">
                <option>SRMCEM</option>
                <option>Study Hall</option>
                <option>BBDITM</option>
                <option>NPGC</option>
                <option>BBAU</option>
                <option>LU</option>
                <option>Amity</option>
            </datalist>

        <br>
        <br>

        <input type="checkbox" id="terms">
        <label for="terms">Accept Terms and Conditions</label>

        <br>
        <br>

        <details>
            <summary>Click to see more details</summary>

            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam sint corrupti non aliquid praesentium amet, repellat aliquam, sapiente consequatur, neque natus iste provident consequuntur possimus vel unde tempore quae a.</p>

        <br>
        <br>



        <button type="submit">Submit</button>

    </form>

    
</body>
</html>
